name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0），须与 version.properties 一致'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本 tag
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            TAG_NAME="v${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            echo "::error::请打 v* tag，或手动运行时填写 version 输入"
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved release: ${TAG_NAME}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装环境）
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "sdkmanager: $SDKM"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | head -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 版本号与红线校验
        run: |
          python3 scripts/ci_guard.py --check version --version "${{ steps.version.outputs.name }}"
          python3 scripts/ci_guard.py --check all

      - name: 单元测试门禁
        run: ./gradlew :app:testDebugUnitTest

      - name: 恢复签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 Secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/litelisten.jks"

      - name: 构建签名 Release APK
        env:
          LITELISTEN_REQUIRE_SIGNING: 'true'
          LITELISTEN_KEYSTORE_PATH: ${{ runner.temp }}/litelisten.jks
          LITELISTEN_KEYSTORE_PASSWORD: ${{ secrets.LITELISTEN_KEYSTORE_PASSWORD }}
          LITELISTEN_KEY_ALIAS: ${{ secrets.LITELISTEN_KEY_ALIAS }}
          LITELISTEN_KEY_PASSWORD: ${{ secrets.LITELISTEN_KEY_PASSWORD }}
        run: ./gradlew clean :app:assembleRelease --stacktrace

      - name: 验签 + 包体门禁（<= 20MB）
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::未找到已签名 app-release.apk（检查签名 Secrets 是否齐全）"
            exit 1
          fi
          "$BT/apksigner" verify --verbose "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -gt $((20 * 1024 * 1024)) ]; then
            echo "::error::APK 超过 20MB 上限"
            exit 1
          fi
          "$BT/aapt" dump badging "$APK" | head -3

      - name: 产物权限白名单审计（合并后 Manifest）
        run: python3 scripts/ci_guard.py --check apk --apk app/build/outputs/apk/release/app-release.apk

      - name: 重命名与 SHA-256
        id: artifact
        run: |
          set -euo pipefail
          OUT="LiteListen-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物（含 R8 mapping）
        uses: actions/upload-artifact@v4
        with:
          name: litelisten-release-${{ steps.version.outputs.tag }}
          path: |
            LiteListen-*.apk
            LiteListen-*.apk.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 轻听 ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            LiteListen-*.apk
            LiteListen-*.apk.sha256
          body: |
            ## 轻听 LiteListen ${{ steps.version.outputs.tag }}

            本地 + 局域网音乐播放器，零账号、零广告、零遥测、零外网请求。

            **v2.0.2 是局域网发现修复版，建议所有用户安装这一版**（针对实机反馈「发现不了网络里的电脑和服务器」「连接根目录返回无法识别的内容（）」）：
            - 新增真正的局域网主机扫描：进入「来源」页即探测本机 Wi-Fi 子网里开放文件共享端口的电脑与 NAS（SMB / WebDAV），并显示 NetBIOS 设备名与扫描范围。此前只发 SSDP，普通 Windows / NAS 共享根本不会响应。
            - 端口探测显式绑定 Wi-Fi / 以太网网络，修好「Wi-Fi 无互联网 + 开着蜂窝数据」时一台都扫不到的问题；SSDP 同步修好接口绑定、组播锁与等待时长。
            - 根目录失败不再只显示「无法识别的内容（）」：现在会明确告诉你是 HTTP 状态码、地址填成网页、空响应、SMB 共享名错误还是目录读取失败，并给出下一步做法。
            - 从发现的设备进入向导后可「自动查找共享」，列出这台机器上可用的共享名，点一下自动填入，不必再猜；支持 Windows / 群晖 / 威联通及中文共享名。
            - SMB 测试连接不再吞掉列目录异常，避免「测试成功、一进根目录就报错」；WebDAV 非 XML 响应、DLNA SOAP 响应均加容错。

            完整功能：
            - 扫描手机里的音乐，按歌曲 / 专辑 / 艺术家 / 文件夹浏览，支持手动选目录与重新扫描。
            - Media3 后台播放：通知栏 / 锁屏 / 蓝牙控制、播放队列、随机、循环、倍速、睡眠定时、断点恢复。
            - 添加 SMB / WebDAV 服务器，自动发现局域网电脑 / NAS 与 DLNA 媒体服务器；可浏览目录、直接播放、导入曲库。
            - 中文 / 拼音 / 首字母搜索、收藏、最近播放、LRC 歌词（可手动选文件）、均衡器与低音增强。
            - 所有目标地址强制限定在局域网私网，公网地址在请求发出前即被拦截。

            - 安装：下载 APK 后在手机上允许「安装未知来源」，直接安装即可；已装 v1.0.0 可**直接覆盖升级**（同一签名密钥，数据不丢）。
            - 适用 Android 8.0（API 26）及以上。
            - 校验：`sha256sum -c LiteListen-${{ steps.version.outputs.tag }}.apk.sha256`

      - name: 清理临时密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/litelisten.jks"
