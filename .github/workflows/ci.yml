name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（使用 runner 预装环境）
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKM" ]; then echo "::error::找不到 sdkmanager"; exit 1; fi
          echo "sdkmanager: $SDKM"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          "$SDKM" --list_installed | head -20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 红线静态检查（不联网 / 不多申请权限 / 无 GPL 与统计 SDK）
        run: python3 scripts/ci_guard.py --check all

      - name: 组装 Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: 单元测试
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: 上传产物与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litelisten-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
